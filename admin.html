  --blue:#111111; --blue-d:#084A87; --blue-l:#EAF2FB; --link:#0F6CBF;
  --orange:#F26B1D; --orange-d:#D85A10; --gold:#FDB515;
  --ink:#111111; --mute:#6B7480; --line:#DEE2E6; --line-s:#EEF1F4; --bg:#F4F6F9;
  --ok:#1F9D63; --ok-bg:#E7F6EE; --bad:#D6293E; --bad-bg:#FDECEE; --warn:#C98200; --warn-bg:#FFF4D9;
  --red:#BE0B2E;
}
*{box-sizing:border-box;margin:0}
body{font-family:'Times New Roman',Times,serif;font-weight:400;font-size:14.5px;color:var(--ink);line-height:1.55;min-height:100vh;background:var(--bg)}
h1,h2,h3,h4{font-weight:700;line-height:1.25;letter-spacing:-.01em}
b,strong{font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--link)}
:focus-visible{outline:3px solid #7FB2EA;outline-offset:2px}
.hidden{display:none!important}
.muted{color:var(--mute)}
svg{flex:none}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:4px;padding:7px 16px;font-weight:600;display:inline-flex;gap:6px;align-items:center;justify-content:center;text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover{background:var(--blue-d);border-color:var(--blue-d)}
.btn.soft{background:#fff;color:var(--blue);border-color:#B7CCE3}
.btn.soft:hover{background:var(--blue-l);border-color:var(--blue)}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.btn.ghost:hover{background:rgba(255,255,255,.14)}
.btn.danger{background:var(--bad);border-color:var(--bad)}.btn.danger:hover{background:#B51F32;border-color:#B51F32}
.btn.sm{padding:3px 11px;font-size:.86rem}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- cards / forms ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:20px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card h3{font-size:1.05rem;margin-bottom:12px}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:.86rem;font-weight:600;margin-bottom:4px}
.field small{display:block;color:var(--mute);margin-top:3px}
input,select,textarea{width:100%;border:1px solid #CED4DA;border-radius:4px;padding:8px 12px;background:#fff}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(11,92,168,.15);outline:0}
textarea{resize:vertical;min-height:84px}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--blue)}
.msg{min-height:1.3em;color:var(--bad);font-size:.9rem;margin:4px 0 10px}
.hint{background:var(--warn-bg);border:1px solid #F2DA9B;border-radius:6px;padding:10px 14px;font-size:.9rem;margin-bottom:16px}
.test{background:var(--bg);border:1px dashed #CED4DA;border-radius:6px;padding:10px 12px;font-size:.9rem;margin:-4px 0 12px}
.empty{text-align:center;padding:30px;color:var(--mute)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.row .grow{flex:1}
.g2{display:grid;grid-template-columns:90px 80px 1fr;gap:12px}
.g2b{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg)}
.login .card{width:min(420px,100%);padding:30px;border-top:4px solid var(--blue)}
.login img{width:72px;height:72px;border-radius:50%;display:block;margin:0 auto 10px}
.login h1{text-align:center;font-size:1.5rem;color:var(--orange);margin-bottom:16px}
.camwrap{display:inline-flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 14px}
.cam{height:84px}

/* ---------- app shell: blue top bar + left menu ---------- */
.app{min-height:100vh;display:flex;flex-direction:column}
.atop{background:var(--blue);color:#fff;display:flex;align-items:center;gap:16px;padding:8px 20px;position:sticky;top:0;z-index:40}
.atop .brand{display:flex;align-items:center;gap:10px}
.atop .brand img{width:38px;height:38px;border-radius:50%;background:#fff;padding:2px}
.atop .brand b{font-size:1.15rem;font-style:italic;font-weight:800;display:block;line-height:1.05}
.atop .brand small{color:rgba(255,255,255,.85);font-size:.76rem}
.atop-r{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:.86rem}
.atop .btn.soft{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}.atop .btn.soft:hover{background:rgba(255,255,255,.14)}
.pill-demo{background:var(--gold);color:#4B3300;border-radius:4px;padding:1px 9px;font-size:.76rem;font-weight:700}
.pill-ok{background:#fff;color:var(--ok);border-radius:4px;padding:1px 9px;font-size:.76rem;font-weight:700}
.shell{display:grid;grid-template-columns:244px minmax(0,1fr);flex:1;align-items:start}
.side{background:#fff;border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:54px;height:calc(100vh - 54px);overflow:auto}
.nb{background:none;border:0;border-left:3px solid transparent;text-align:left;padding:9px 12px;border-radius:4px;font-weight:500;display:flex;gap:11px;align-items:center;color:var(--ink);text-decoration:none}
.nb svg{width:18px;height:18px;color:var(--mute)}
.nb:hover{background:var(--bg)}
.nb.on{background:var(--blue-l);border-left-color:var(--blue);color:var(--blue);font-weight:600}.nb.on svg{color:var(--blue)}
.kbd{margin:10px 0 6px;border:1px solid #CED4DA;background:#fff;border-radius:4px;padding:8px 12px;font-size:.86rem;color:var(--mute);display:flex;justify-content:space-between;width:100%;text-align:left}
.kbd:hover{border-color:var(--blue)}.kbd b{font-weight:500;font-size:.78rem}
.content{padding:26px 32px 60px;min-width:0;max-width:1320px;width:100%}
.content>h1,.content>h2{font-size:1.7rem;color:var(--orange);margin-bottom:16px}

/* ---------- dashboard ---------- */
.ahero{position:relative;overflow:hidden;background:var(--blue);color:#fff;border-radius:8px;border-top:4px solid var(--orange);padding:26px 30px;margin-bottom:22px}
.ahero small{color:rgba(255,255,255,.85)}
.ahero h2{font-size:1.9rem!important;margin:6px 0!important;color:var(--gold)}
.ahero p{color:rgba(255,255,255,.92);max-width:60ch}
.ahero .qa,.ahero .ins{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.ahero .ins span{background:var(--blue-d);border:1px solid rgba(255,255,255,.16);border-radius:6px;padding:6px 14px;font-weight:500;font-size:.88rem}
.ahero .btn{background:var(--orange);border-color:var(--orange);color:#fff}.ahero .btn:hover{background:var(--orange-d);border-color:var(--orange-d)}
.ahero .btn.ghost{background:transparent;border-color:rgba(255,255,255,.55);color:#fff}.ahero .btn.ghost:hover{background:rgba(255,255,255,.14)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
.stat.card{padding:18px 20px;border-left:4px solid var(--blue);color:var(--mute)}
.stat b{font-size:2.1rem;font-weight:700;display:block;line-height:1.1;color:var(--ink);margin-bottom:2px}
.stat.a{border-left-color:var(--blue)}.stat.b{border-left-color:var(--orange)}.stat.c{border-left-color:var(--gold)}.stat.d{border-left-color:var(--ok)}
.hbar{display:grid;grid-template-columns:minmax(80px,36%) 1fr 90px;gap:10px;align-items:center;margin:8px 0;font-size:.9rem}
.hbar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .b{height:10px;border-radius:99px;overflow:hidden;background:#E9ECEF}
.hbar .b i{display:block;height:100%;background:var(--blue);border-radius:99px}
.week{display:flex;align-items:flex-end;gap:10px;height:150px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:.78rem;color:var(--mute)}
.week i{display:block;width:100%;max-width:38px;border-radius:4px 4px 0 0;background:#B7CCE3;min-height:6px}
.week .today i{background:var(--blue)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.tool{display:flex;flex-direction:column;gap:10px}.tool p{flex:1;font-size:.9rem;color:var(--mute)}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
.card .tbl-wrap{border:0;border-radius:0}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;font-weight:600;padding:10px 14px;background:#F1F3F5;border-bottom:1px solid var(--line);white-space:nowrap;color:#495057}
td{padding:10px 14px;border-bottom:1px solid var(--line-s);vertical-align:middle}
tbody tr:nth-child(even){background:#FAFBFC}
tbody tr:hover{background:var(--blue-l)}
tr:last-child td{border-bottom:0}
.acts{display:flex;gap:6px;white-space:nowrap}
.tag{display:inline-block;white-space:nowrap;border-radius:3px;padding:1px 9px;font-size:.78rem;font-weight:600;background:var(--warn-bg);color:var(--warn)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.off{background:#F1F3F5;color:var(--mute)}
.chs{display:flex;gap:4px;flex-wrap:wrap;max-width:420px}.chs .tag{font-size:.74rem;white-space:normal}
.sw{position:relative;width:42px;height:22px;display:inline-block;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;border-radius:99px;background:#CED4DA;transition:.15s}
.sw i::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw input:checked+i{background:var(--blue)}.sw input:checked+i::after{left:23px}
.sw input:focus-visible+i{outline:3px solid #7FB2EA;outline-offset:2px}
.bulk{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;margin-bottom:14px;border-radius:6px;background:var(--blue-l);border:1px solid #B7CCE3}
.bk,#ball{width:17px!important;height:17px;padding:0}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 14px}.thumbs img{width:92px;height:68px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.dayb{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.dayb button{flex:1;min-width:84px;border:1px solid #CED4DA;background:#fff;border-radius:6px;padding:8px;text-align:center;font-weight:600}
.dayb button b{display:block;font-size:1.2rem;color:var(--blue)}.dayb button small{color:var(--mute)}
.dayb button.on{background:var(--blue);border-color:var(--blue)}.dayb button.on *{color:#fff}

/* ---------- modal / palette / toasts ---------- */
.ov{position:fixed;inset:0;background:rgba(20,28,38,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow-y:auto}
.modal{background:#fff;border-radius:8px;box-shadow:0 20px 60px rgba(20,28,38,.3);width:min(700px,100%);padding:24px;border-top:4px solid var(--blue)}
.modal h3{font-size:1.3rem;margin-bottom:14px;color:var(--orange)}
.pal{max-width:620px;margin-top:8vh}.pal input{font-size:1.05rem;padding:12px 16px}.pl{margin-top:10px;max-height:52vh;overflow:auto}
.pl button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px 14px;border-radius:4px}
.pl button:hover,.pl button.f{background:var(--blue-l)}.pl small{color:var(--mute)}
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;width:min(92vw,440px)}
.toast{background:#23272B;color:#fff;border-radius:6px;padding:10px 16px;font-weight:500;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad)}.toast.warn{background:#8a5a00}.toast.ok{background:var(--ok)}

/* ---------- responsive ---------- */
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:6px;border-right:0;border-bottom:1px solid var(--line)}
  .nb{border-left:0;border-bottom:3px solid transparent;border-radius:4px;white-space:nowrap}.nb.on{border-bottom-color:var(--blue)}
  .kbd{display:none}
  .atop-r .em{display:none}
  .cols,.g2,.g2b{grid-template-columns:1fr}
  .content{padding:18px 14px 50px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== Inspire red skin v3 ===== */
:root{--blue:#E0243A;--blue-d:#BE1A2F;--blue-l:#FFF0F1;--link:#C81E34;--orange:#E0243A;--orange-d:#BE1A2F;--gold:#FFC145;--ink:#111111;--mute:#7A6B72;--line:#EFDDE0;--line-s:#F7ECEE;--bg:#FBF5F5;--sh:0 1px 2px rgba(120,20,40,.06),0 8px 24px -12px rgba(190,26,47,.2)}
body{font-family:'Times New Roman',Times,serif;background:var(--bg)}
h1,h2,h3,h4{letter-spacing:-.01em}:focus-visible{outline:3px solid #FFB3BC}
.btn{border-radius:10px;background:linear-gradient(180deg,#EE3B50,#D61F36);border:0;box-shadow:0 6px 14px -6px rgba(214,31,54,.55);transition:transform .15s}
.btn:hover{background:linear-gradient(180deg,#E5293F,#C51A2F);transform:translateY(-1px)}
.btn.soft{background:#fff;color:var(--link);border:1px solid #F3C4CB;box-shadow:none}.btn.soft:hover{background:var(--blue-l);transform:none}
.btn.danger{background:#7A1020;box-shadow:none}.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.55);box-shadow:none}
.card{border-radius:16px;box-shadow:var(--sh)}.card h3{color:var(--ink)}
input,select,textarea{border-radius:10px;border-color:#EAD3D7}input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(224,36,58,.14)}
.atop{background:linear-gradient(90deg,#9E0F25,#D61F36 60%,#F2545B);padding:0 24px;min-height:56px}
.atop .brand img{border-radius:50%}.atop .brand b{font-style:normal;font-weight:800;letter-spacing:.03em}
.shell{grid-template-columns:268px minmax(0,1fr)}
.side{top:56px;height:calc(100vh - 56px);background:#fff;padding:18px 12px;gap:4px;border-right:1px solid var(--line)}
.nb{border-left:0;border-radius:12px;padding:11px 14px;color:var(--ink);font-weight:500}.nb svg{color:#B59BA2}
.nb:hover{background:var(--blue-l)}
.nb.on{background:linear-gradient(90deg,#FFE3E6,#FFF4F5);color:var(--blue-d);font-weight:700;box-shadow:inset 3px 0 0 var(--blue)}.nb.on svg{color:var(--blue)}
.content{max-width:1280px;padding:32px 40px 80px}
.content>h1,.content>h2{font-size:1.9rem;font-weight:800;color:var(--ink);margin-bottom:18px}
.ahero{background:radial-gradient(520px 260px at 95% -20%,rgba(255,193,69,.5),transparent 70%),linear-gradient(135deg,#C8142D,#E0243A 55%,#FF5B6B);color:#fff;border:0;border-radius:22px;padding:30px 34px;box-shadow:0 24px 50px -24px rgba(190,26,47,.7)}
.ahero h2{color:#fff!important;font-weight:800}.ahero small,.ahero p{color:rgba(255,255,255,.92)}
.ahero .ins span{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.28);color:#fff;border-radius:99px}
.ahero .btn{background:#fff;color:var(--blue-d);box-shadow:none}.ahero .btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6)}.ahero .btn.ghost:hover{background:rgba(255,255,255,.16)}
.stats{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.stat.card{border:1px solid var(--line);border-top:0;border-left:0;position:relative;overflow:hidden;padding:20px}
.stat.card:after{content:"";position:absolute;right:-18px;top:-18px;width:84px;height:84px;border-radius:50%;background:var(--blue-l)}
.stat.b:after{background:#FFF1D6}.stat.c:after{background:#FFE3E6}.stat.d:after{background:#E7F6EE}
.stat b{color:var(--blue-d);position:relative;z-index:1}
.hbar .b,.week i{background:#F5E4E7}.hbar .b i{background:linear-gradient(90deg,#F59E5B,#E0243A)}.week .today i{background:linear-gradient(180deg,#EE3B50,#C81E34)}.week i{background:#F6C3CA}
.tbl-wrap{border-radius:16px;box-shadow:var(--sh);border-color:var(--line)}
th{background:#FFF4F5;color:var(--blue-d)}tbody tr:nth-child(even){background:none}tbody tr:hover{background:#FFF8F8}
.bulk{background:var(--blue-l);border-color:#F3C4CB;border-radius:12px}
.sw input:checked+i{background:var(--blue)}
.modal{border-top:0;border-radius:20px}.modal h3{color:var(--ink);font-weight:800}
.login{background:radial-gradient(600px 300px at 80% 0,rgba(255,193,69,.4),transparent 70%),linear-gradient(135deg,#FFE9EB,#FFF7F7)}
.login .card{border-top:0;border-radius:22px;box-shadow:0 30px 60px -24px rgba(190,26,47,.45)}.login h1{color:var(--blue-d);font-weight:800}
.pl button:hover,.pl button.f{background:var(--blue-l)}
.dayb button.on{background:var(--blue);border-color:var(--blue)}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:860px){.shell{grid-template-columns:1fr}.side{top:auto;height:auto}.nb.on{box-shadow:inset 0 -3px 0 var(--blue)}.content{padding:20px 14px 60px}}
/* ===== v4: bài giảng Drive lớn + nút tinh chỉnh ===== */
.btn{font-weight:600;font-size:.92rem;letter-spacing:.005em;padding:10px 20px;border-radius:12px;background:linear-gradient(180deg,#F04A5E 0,#DC2740 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 1px 2px rgba(150,15,35,.3),0 8px 18px -10px rgba(214,31,54,.65);transition:transform .12s,box-shadow .12s,filter .12s}
.btn:hover{filter:brightness(1.05);transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 2px 4px rgba(150,15,35,.28),0 12px 22px -10px rgba(214,31,54,.7)}
.btn:active{transform:translateY(1px) scale(.985);filter:brightness(.96)}
.btn.sm{padding:7px 14px;font-size:.84rem;border-radius:10px}
.btn.soft{background:#fff;color:#B3182C;border:1px solid #F1CBD1;box-shadow:0 1px 2px rgba(120,20,40,.06)}
.btn.soft:hover{background:#FFF3F4;border-color:#E9A9B3;filter:none;box-shadow:0 4px 12px -6px rgba(190,26,47,.35)}
.btn.mint{background:linear-gradient(180deg,#EAF8F1,#D8F1E4);color:#0F6B43;border:1px solid #A8DCC2;box-shadow:0 1px 2px rgba(15,107,67,.12)}
.btn svg{width:1em;height:1em}
.icon-btn,.spk{box-shadow:0 1px 2px rgba(120,20,40,.1);border-color:#F1CBD1;color:#B3182C;background:#fff}
.opt,.aopt,.tile,.lt,.kb button{border-radius:12px;border:1px solid #EBD3D8;box-shadow:0 1px 2px rgba(120,20,40,.05);transition:transform .1s,background .12s,border-color .12s}
.opt:active,.tile:active,.lt:active,.aopt:active{transform:scale(.97)}
.opt.on{background:linear-gradient(180deg,#F04A5E,#DC2740);color:#fff;border-color:#DC2740}
.cdtabs{overflow-x:auto;max-width:100%;flex-wrap:nowrap;scrollbar-width:none}.cdtabs::-webkit-scrollbar{display:none}
.cdtabs .btn,.cdtabs .btn.soft{white-space:nowrap;box-shadow:none;border:0}
.cdtabs .btn.on,.cdtabs .btn.soft.on{box-shadow:0 6px 14px -8px rgba(214,31,54,.8)}

/* ===== Chat học sinh ===== */
.bdg{margin-left:auto;min-width:20px;height:20px;border-radius:99px;background:var(--blue);color:#fff;font-size:.74rem;font-weight:800;display:grid;place-items:center;padding:0 6px}
.chatx{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;height:calc(100vh - 200px);min-height:480px}
.cx-l,.cx-r{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;min-height:0}
.cx-l .cx-s{padding:12px;border-bottom:1px solid var(--line)}
.cx-l .cx-s input{width:100%;border:1px solid #EAD3D7;border-radius:10px;padding:8px 12px}
#cx-list{overflow-y:auto;flex:1}
.cx-i{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:12px 14px}
.cx-i:hover{background:var(--blue-l)}.cx-i.on{background:#FFF0F1;box-shadow:inset 3px 0 0 var(--blue)}
.cx-av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--blue-l);color:var(--blue-d);display:grid;place-items:center;font-weight:800}
.cx-b{flex:1;min-width:0}.cx-b b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx-b small{display:block;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx-i.un .cx-b b,.cx-i.un .cx-b small{color:var(--ink);font-weight:800}

/* ===== v20: hệ thống giao diện thống nhất (toàn bộ web + quản trị) ===== */
:root{--r-sm:8px;--r-md:12px;--r-lg:16px;--sh-1:0 1px 2px rgba(16,24,40,.05);--sh-2:0 8px 22px -14px rgba(16,24,40,.28);--sh-3:0 24px 60px -24px rgba(16,24,40,.4);--ring:0 0 0 3px rgba(190,11,46,.16);--brand:#BE0B2E;--brand-d:#8F0620;--brand-l:#FCEBEE;--text-b:#111111}

input::placeholder,textarea::placeholder{color:#9AA3AF}
input[type=checkbox],input[type=radio]{accent-color:var(--brand);width:16px;height:16px}
.field>span{font-size:12.5px;font-weight:700;color:#111111;text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
.field small,small.muted,.muted{color:#6B7280}
/* nút */
.btn{min-height:40px;border-radius:var(--r-sm);padding:9px 18px;font-size:14px;font-weight:700;letter-spacing:.01em;background:var(--brand);border:1px solid var(--brand);color:#fff;box-shadow:0 6px 16px -10px rgba(190,11,46,.7);transition:background .15s,transform .05s,box-shadow .15s}
.btn:hover{background:var(--brand-d);border-color:var(--brand-d);box-shadow:0 8px 20px -10px rgba(143,6,32,.8)}

.btn.danger:hover{background:#FDECEE;border-color:#E9A3AE;color:#8F1C26}
.btn.sm{min-height:30px;padding:5px 11px;font-size:12.5px;border-radius:7px}

/* ===== v21: giao diện kiểu Google Sheets (phẳng, gọn, dễ đọc) ===== */

h1,h2,h3,h4,.sec,.content>h2,.cxl-sec>h2,.cxl-hero h1{font-family:inherit!important;text-transform:none!important;letter-spacing:0;color:var(--gs-txt)}

th[data-sortable]:hover{background:#FCE8EC!important}
th[data-dir=asc]::after,th[data-dir=desc]::after{color:var(--brand)}
.gs-q{background-color:#fff!important}
.gs-cnt{color:var(--mute);font-family:var(--serif)}

/* nhãn trạng thái */
.tag{font-family:var(--serif);font-size:13px!important;font-weight:700;letter-spacing:0;text-transform:none!important;border-radius:999px!important;padding:2px 10px!important;border:0}
.tag.ok{background:#E7F6EE!important;color:#17784D!important}
.tag.bad{background:#FDECEE!important;color:#B3212F!important}
.tag.off{background:#F1F2F4!important;color:#5B6470!important}

/* công tắc */
.sw i{background:#CFC6C9}
.sw input:checked+i{background:var(--brand)!important}

/* thẻ tổng quan */
.ahero,.thero{background:radial-gradient(520px 240px at 95% -20%,rgba(255,193,69,.45),transparent 70%),linear-gradient(135deg,#C8142D,#E0243A 55%,#FF5B6B)!important;color:#fff!important;border:0!important;border-radius:20px!important;box-shadow:0 22px 46px -22px rgba(190,26,47,.7)!important;padding:26px 30px}
.ahero h2,.thero h2{color:#fff!important}
.ahero p,.ahero small,.thero p{color:rgba(255,255,255,.92)!important}
.ahero .btn,.thero .btn{background:#fff!important;color:var(--brand-d)!important;box-shadow:none!important}
.ahero .ins span,.thero-s>div{background:rgba(255,255,255,.16)!important;border:1px solid rgba(255,255,255,.28)!important;color:#fff!important;border-radius:12px!important}
.thero-k{background:rgba(255,255,255,.2)!important;color:#fff!important;border-radius:999px!important;font-family:var(--serif);text-transform:none!important}
.stat.card{border:1px solid var(--line)!important;border-top:3px solid var(--brand)!important;border-radius:16px!important;padding:18px 20px}
.stat.a{border-top-color:#E0243A!important}.stat.b{border-top-color:var(--accent)!important}.stat.c{border-top-color:var(--gold)!important}.stat.d{border-top-color:#1F9D63!important}
.stat b{font-size:32px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
.stat.card{color:var(--mute)}
.hbar .b{background:#F3E4E7!important;height:9px}
.hbar .b i{background:linear-gradient(90deg,#F59E5B,var(--brand))!important}
.week i{background:#F6C3CA!important;border-radius:6px 6px 0 0}
.week .today i{background:linear-gradient(180deg,#EE3B50,#C81E34)!important}

/* thẻ lớp, tab, mục */
.cxgrid{gap:14px}
.cxcard{background:#fff;border:1px solid var(--line)!important;border-radius:16px!important;padding:18px 18px 16px;box-shadow:var(--sh-1)}
.cxcard:hover{box-shadow:var(--sh-2)!important;border-color:#E3C3CA!important;transform:translateY(-2px)}
.cxs{background:#fff;border:1px solid var(--line)!important;border-radius:16px!important;box-shadow:var(--sh-1)}
.cxi-ic{background:var(--brand-l)!important;border-radius:10px}
.cxi:hover{background:#FBF6F7;border-radius:10px}
.cxtabs{border-bottom:1px solid var(--line);gap:4px}
.cxtabs button{font-family:var(--serif);font-size:15px;font-weight:700;border-radius:10px 10px 0 0;padding:10px 14px}
.cxtabs button.on{color:var(--brand)!important;border-bottom-color:var(--brand)!important;background:var(--brand-l)}
.cxl-hero{background:#fff;border:1px solid var(--line)!important;border-left:6px solid var(--accent)!important;border-radius:16px!important;box-shadow:var(--sh-1)}
.cxl-hero h1{color:var(--accent)!important;font-size:28px}
.cxl-sec>h2{font-size:17px;font-weight:800}
.cxl-sec>h2::before{background:#FBEFE8!important;border-radius:9px}
.cxl-nb{border-radius:10px}
.cxl-nb.on{background:var(--brand)!important;color:#fff!important}
.cxl-nb.on .bdg-n{background:#fff!important;color:var(--brand)!important}
.hub-t,.tile,.tool{background:#fff;border:1px solid var(--line)!important;border-radius:16px!important;box-shadow:var(--sh-1)}
.hub-t:hover{box-shadow:var(--sh-2)!important;border-color:#E3C3CA!important;transform:translateY(-2px)!important}
.hub-t b{font-family:var(--serif)}
.thumbs img{border-radius:12px;border:1px solid var(--line)}

/* hộp thoại */
.ov{background:rgba(40,12,20,.42)!important;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal{background:#fff;border:0!important;border-top:4px solid var(--brand)!important;border-radius:18px!important;box-shadow:var(--sh-3)!important}
.modal>h3{background:#fff;font-size:20px;font-weight:800;color:var(--ink);border-bottom:1px solid var(--line-s)}
.modal>.row:last-child{background:#fff;border-top:1px solid var(--line-s)!important}

/* thông báo */
.toast{background:#23272B!important;color:#fff!important;border:0!important;border-radius:12px!important;box-shadow:0 12px 28px -12px rgba(0,0,0,.45)!important;font-family:var(--serif);font-size:15px;font-weight:600;padding:12px 16px}
.toast.bad{background:var(--brand)!important}
.toast.ok{background:#1F9D63!important}
.toast.warn{background:#8a5a00!important}

/* đăng nhập: giữ nền đỏ Inspire */
.login{background:radial-gradient(600px 300px at 80% 0,rgba(255,193,69,.4),transparent 70%),linear-gradient(135deg,#8F0620 0,#BE0B2E 55%,#E0243A 100%)!important}
.login .card{border:0!important;border-radius:22px!important;box-shadow:0 30px 60px -28px rgba(0,0,0,.5)!important;padding:34px 30px}
.login .card h1{color:var(--accent)!important;text-align:center}
.login .card img{box-shadow:0 0 0 1px #F0D3D9}
.login .card .btn{border-radius:12px!important;min-height:46px;font-size:16px}
.login .card input{background:#fff!important}

/* cuộn & chi tiết */
*{scrollbar-color:#E2C7CC transparent}
::-webkit-scrollbar-thumb{background:#E2C7CC;border-radius:8px}
#gs-top{background:var(--brand)!important;color:#fff!important;border:0!important;box-shadow:0 8px 20px -8px rgba(190,11,46,.7)!important}

@media(max-width:860px){
  .side{border-bottom:1px solid var(--line)!important}
  .content{padding:18px 14px 80px}
  .content>h2:first-child{font-size:26px}
}
@media(max-width:640px){
  .modal{border-radius:18px 18px 0 0!important}
  .toasts{left:12px;right:12px;width:auto}
}
.fmtbar{display:flex;gap:6px;margin:4px 0 6px;flex-wrap:wrap}.fmtbar button{min-width:34px;height:30px;padding:0 8px;border:1px solid #d9dde6;background:#fff;border-radius:6px;cursor:pointer;font-size:.9rem}.fmtbar button:hover{background:#f3f4f8}

.fmtbar{display:flex;gap:6px;align-items:center;margin:6px 0 8px;padding:6px;background:#FAF5F6;border:1px solid #F0E1E5;border-radius:12px;flex-wrap:wrap}
.fmtbar button{min-width:36px;height:32px;padding:0 10px;border:1px solid #E6D3D8;background:#fff;border-radius:9px;cursor:pointer;font:600 .92rem/1 inherit;transition:.15s}
.fmtbar button:hover{background:#B10B32;border-color:#B10B32;color:#fff!important;transform:translateY(-1px)}
.fmtbar i{width:1px;height:20px;background:#E6D3D8;margin:0 2px}
.fmtbar .hint{margin-left:auto;font-size:.76rem;color:#7A6B72}
.fmtprev{margin-top:8px;padding:12px 16px;border:1px dashed #E3A9B6;border-left:5px solid #B10B32;border-radius:4px 14px 14px 4px;background:linear-gradient(135deg,#FFF6F7,#FFFBF1);line-height:1.8;font-size:.98rem;max-height:200px;overflow:auto}
.fmtprev:empty::before{content:"Xem trước chữ sẽ hiện ở đây…";color:#9a8c92}
.fmtprev small.t{display:block;font-size:.72rem;font-weight:700;letter-spacing:.06em;color:#B10B32;margin-bottom:4px;text-transform:uppercase}
.fmtprev strong{font-weight:800;color:#7E0824}.fmtprev u{text-decoration-thickness:3px;text-underline-offset:4px;text-decoration-color:#F5B73B}
.fmtprev mark.hl{background:linear-gradient(transparent 40%,#FFD966 40%,#FFD966 92%,transparent 92%);padding:0 3px}.fmtprev mark.hl-h{background:#FFC089;padding:1px 5px;border-radius:5px}.fmtprev mark.hl-k{background:#FFC2D4;padding:1px 5px;border-radius:5px}
.fmtprev .c-r{color:#D61F3A;font-weight:600}.fmtprev .c-b{color:#0B5CA8;font-weight:600}.fmtprev .c-o{color:#E8590C;font-weight:600}.fmtprev .c-g{color:#17803D;font-weight:600}

/* ===== admin: đồng bộ tông crimson + nâng cấp modal ===== */
:root{--ds-red:#B10B32;--ds-red-d:#6E0620;--ds-red-l:#FCEBEF;--ds-gold:#E8B04B}
:focus-visible{outline:3px solid rgba(177,11,50,.35);outline-offset:2px}
input:focus,textarea:focus,select:focus{border-color:var(--ds-red)!important;box-shadow:0 0 0 4px rgba(177,11,50,.12)!important;outline:none}
::selection{background:#F7C9D4}
*{scrollbar-width:thin;scrollbar-color:#D9B9C1 transparent}
.modal{border-radius:22px!important;border:0!important;box-shadow:0 40px 80px -30px rgba(40,4,16,.65)!important;position:relative;overflow:hidden}
.modal::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--ds-red-d),var(--ds-red) 50%,var(--ds-gold))}
.modal h3{color:var(--ds-red-d);letter-spacing:.02em}
.navb{color:var(--ds-red)!important}
th{background:var(--ds-red-l)!important;color:var(--ds-red-d)!important}
.card{border-radius:18px!important;box-shadow:0 1px 2px rgba(40,8,18,.05),0 18px 36px -28px rgba(110,6,32,.45)!important}
.btn{border-radius:99px!important}
.btn:not(.soft){box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 20px -12px rgba(177,11,50,.9)}
</style>

/* ---------- Google Sheet ---------- */
function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true; else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; } else if (ch !== '\r') cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
function rowsToWords(rows) {
  const HEAD = ['english', 'word', 'words', 'từ', 'tu', 'từ vựng', 'tu vung', 'vocabulary', 'tiếng anh', 'tieng anh', 'en'];
  const out = rows.map(r => ({ en: (r[0] || '').trim(), vi: (r[1] || '').trim(), ipa: (r[2] || '').trim(), ex: (r[3] || '').trim(), img: /^https?:\/\//.test((r[4] || '').trim()) ? r[4].trim() : '' })).filter(w => w.en && w.vi);
  if (out.length && HEAD.includes(out[0].en.toLowerCase())) out.shift();
  return out;
}
function sheetCsvUrl(url) {
  if (!url) return null; const gid = (url.match(/[#&?]gid=(\d+)/) || [])[1];
  let m = url.match(/spreadsheets\/d\/e\/([\w-]+)/); if (m) return `https://docs.google.com/spreadsheets/d/e/${m[1]}/pub?output=csv` + (gid ? `&gid=${gid}` : '');
  m = url.match(/spreadsheets\/d\/([\w-]+)/); if (m) return `https://docs.google.com/spreadsheets/d/${m[1]}/gviz/tq?tqx=out:csv` + (gid ? `&gid=${gid}` : '');
  return null;
}
async function fetchSheetWords(url) {
  const u = sheetCsvUrl(url); if (!u) throw new Error('Link này không phải Google Sheet');
  const r = await fetch(u); if (!r.ok) throw new Error('Không đọc được Sheet (mã ' + r.status + ')');
  const t = await r.text(); if (t.trim().startsWith('<')) throw new Error('Sheet chưa chia sẻ "Bất kỳ ai có đường liên kết" (quyền Người xem)');
  return rowsToWords(parseCSV(t));
}
function parseManual(text) {
  return text.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const p = l.includes('\t') ? l.split('\t') : l.includes('|') ? l.split('|') : l.split(/\s+[-–=:]\s+/);
    return { en: (p[0] || '').trim(), vi: (p[1] || '').trim(), ipa: (p[2] || '').trim(), ex: (p[3] || '').trim() };
  }).filter(w => w.en && w.vi);
}
function parseMats(text) {
  return text.split('\n').map(l => l.trim()).filter(Boolean).map((l, i) => {
    const m = l.match(/https?:\/\/\S+/); if (!m) return null;
    const title = l.replace(m[0], '').replace(/[|\-–:]+\s*$/, '').replace(/^\s*[|\-–:]+/, '').trim();
    return { title: title || 'Tài liệu ' + (i + 1), url: m[0] };
  }).filter(Boolean);
}

/* ----- thanh định dạng chữ cho ô nhập (in đậm, nghiêng, gạch chân, tô màu) ----- */
function attachFmt(ta) {
  if (!ta || ta.dataset.fmt) return; ta.dataset.fmt = 1;
  const X = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const F = t => t.replace(/&lt;(\/?)(b|strong|i|em|u|s|mark|br)&gt;/gi, '<$1$2>').replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^\s*](?:[^*\n]*?[^\s*])?)\*(?!\*)/g, '$1<em>$2</em>').replace(/__([^_\n]+?)__/g, '<u>$1</u>').replace(/==([^=\n]+?)==/g, '<mark class="hl">$1</mark>').replace(/~~([^~\n]+?)~~/g, '<s>$1</s>').replace(/\{([robgkh]):([^{}\n]+?)\}/g, (m, c, x) => /^[hk]$/.test(c) ? `<mark class="hl-${c}">${x}</mark>` : `<span class="c-${c}">${x}</span>`);
  const R = s => X(s).split(/(https?:\/\/[^\s<]+)/g).map((p, i) => i % 2 ? `<a href="${p}" target="_blank" rel="noopener">${p}</a>` : F(p)).join('').replace(/\n/g, '<br>');
  const pv = document.createElement('div'); pv.className = 'fmtprev';
  const upd = () => { pv.innerHTML = ta.value.trim() ? '<small class="t">Học sinh sẽ thấy</small>' + R(ta.value) : ''; };
  const wrap = (a, b, ph) => {
    const s = ta.selectionStart, e = ta.selectionEnd, v = ta.value, sel = v.slice(s, e) || ph;
    ta.value = v.slice(0, s) + a + sel + b + v.slice(e);
    ta.focus(); ta.setSelectionRange(s + a.length, s + a.length + sel.length); upd();
  };
  const clear = () => { const s = ta.selectionStart, e = ta.selectionEnd; if (s === e) return; const t = ta.value.slice(s, e).replace(/\*\*|__|==|~~/g, '').replace(/\{[robgkh]:([^{}]*)\}/g, '$1'); ta.value = ta.value.slice(0, s) + t + ta.value.slice(e); ta.focus(); ta.setSelectionRange(s, s + t.length); upd(); };
  const B = [['B', '**', '**', 'chữ đậm', 'In đậm (Ctrl+B)', 'font-weight:900'], ['I', '*', '*', 'chữ nghiêng', 'In nghiêng (Ctrl+I)', 'font-style:italic;font-family:serif'], ['U', '__', '__', 'gạch chân', 'Gạch chân (Ctrl+U)', 'text-decoration:underline'], ['S', '~~', '~~', 'gạch ngang', 'Gạch ngang', 'text-decoration:line-through'], '|',
    ['Tô vàng', '==', '==', 'nổi bật', 'Tô vàng nổi bật', 'background:#FFE066'], ['Tô cam', '{h:', '}', 'nổi bật', 'Tô cam', 'background:#FFC089'], ['Tô hồng', '{k:', '}', 'nổi bật', 'Tô hồng', 'background:#FFC2D4'], '|',
    ['A', '{r:', '}', 'chữ đỏ', 'Chữ đỏ', 'color:#D61F3A;font-weight:800'], ['A', '{b:', '}', 'chữ xanh', 'Chữ xanh dương', 'color:#0B5CA8;font-weight:800'], ['A', '{o:', '}', 'chữ cam', 'Chữ cam', 'color:#E8590C;font-weight:800'], ['A', '{g:', '}', 'chữ xanh lá', 'Chữ xanh lá', 'color:#17803D;font-weight:800'], '|', ['Xoá', 0, 0, 0, 'Xoá định dạng phần đang bôi đen', 'font-size:.8rem']];
  const bar = document.createElement('div'); bar.className = 'fmtbar';
  bar.innerHTML = B.map((x, i) => x === '|' ? '<i></i>' : `<button type="button" data-i="${i}" title="${x[4]}" style="${x[5]}">${x[0]}</button>`).join('') + '<span class="hint">Bôi đen chữ rồi bấm nút</span>';
  bar.addEventListener('mousedown', e => e.preventDefault());
  bar.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; e.preventDefault(); const x = B[+b.dataset.i]; x[1] ? wrap(x[1], x[2], x[3]) : clear(); });
  ta.parentNode.insertBefore(bar, ta); ta.parentNode.appendChild(pv);
  ta.addEventListener('input', upd); upd();
  ta.addEventListener('keydown', e => { if (!(e.ctrlKey || e.metaKey) || e.altKey) return; const i = { b: 0, i: 1, u: 2 }[e.key.toLowerCase()]; if (i == null) return; e.preventDefault(); wrap(B[i][1], B[i][2], B[i][3]); });
}

function gradeData(c) {
  const B = cBanks(c), U = (c.members || []).map(id => stuOf(c, id)).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'vi'));
  const sc = (u, b) => (u.bankbest || {})[b.id];
  return { B, U, sc, avg: u => { const v = B.map(b => sc(u, b)).filter(x => x != null); return v.length ? Math.round(v.reduce((a, x) => a + x, 0) / v.length) : null; } };
}
function cxGrades(c, el) {
  const { B, U, sc, avg } = gradeData(c), col = v => v == null ? '' : `style="font-weight:700;color:${v >= 80 ? '#1B7F3B' : v >= 50 ? '#9A6A00' : '#B10B32'}"`;
  if (!B.length || !U.length) { el.innerHTML = `<div class="card empty">${!B.length ? 'Lớp chưa có đề nào để chấm điểm. Tạo đề ở tab “Đề và kiểm tra”.' : 'Lớp chưa có học sinh.'}</div>`; return; }
  const col2 = B.map(b => { const v = U.map(u => sc(u, b)).filter(x => x != null); return { n: v.length, a: v.length ? Math.round(v.reduce((x, y) => x + y, 0) / v.length) : null }; });
  el.innerHTML = `<div class="row"><p class="muted grow" style="margin:0">Điểm cao nhất của từng học sinh ở mỗi đề của lớp. Xanh từ 80%, vàng từ 50%, đỏ dưới 50%.</p><button class="btn soft" data-a="gr-csv">Tải bảng điểm (CSV)</button></div>
    <div class="card tbl-wrap"><table><thead><tr><th>Học sinh</th>${B.map(b => `<th title="${esc(b.title)}">${esc(b.title.length > 22 ? b.title.slice(0, 21) + '…' : b.title)}</th>`).join('')}<th>Trung bình</th></tr></thead><tbody>
    ${U.map(u => { const a = avg(u); return `<tr><td><b>${esc(u.name || 'Học sinh')}</b></td>${B.map(b => { const v = sc(u, b); return `<td ${col(v)}>${v == null ? '–' : v + '%'}</td>`; }).join('')}<td ${col(a)}>${a == null ? '–' : a + '%'}</td></tr>`; }).join('')}
    <tr style="background:#faf4f5"><td><b>Trung bình lớp</b></td>${col2.map(x => `<td><b>${x.a == null ? '–' : x.a + '%'}</b><br><small class="muted">${x.n}/${U.length} em</small></td>`).join('')}<td></td></tr></tbody></table></div>`;
}
function gradesCsv(c) {

function clsRiskRows(c) {
  const B = cBanks(c), now = Date.now();
  return (c.members || []).map(id => stuOf(c, id)).map(u => {
    const last = tsMs(u.lastActive), days = last ? Math.floor((now - last) / 864e5) : null;
    const best = B.map(b => (u.bankbest || {})[b.id]).filter(x => x != null);
    const avg = best.length ? Math.round(best.reduce((a, x) => a + x, 0) / best.length) : null;
    const tried = B.filter(b => (u.bankatt || {})[b.id]).length, reasons = [];
    if (days === null || days >= 5) reasons.push(days === null ? 'chưa vào học lần nào' : 'không vào học ' + days + ' ngày');
    if (B.length && !tried) reasons.push('chưa làm bài tập nào của lớp');
    if (avg != null && avg < 50) reasons.push('điểm trung bình ' + avg + '%');
    return { u, days, avg, tried, reasons };
  }).sort((a, b) => b.reasons.length - a.reasons.length || (a.avg ?? 101) - (b.avg ?? 101));
}
function cxRisk(c, el) {

async function mergeClasses(T, srcs) {
  const members = [...(T.members || [])], names = { ...(T.names || {}) }, tUids = [...(T.teacherUids || [])], tNames = { ...(T.teacherNames || {}) };
  const secs = JSON.parse(JSON.stringify(T.sections || [])).map(s => ({ ...s, items: s.items || [] }));
  const titles = new Set(secs.map(s => s.title));
  for (const s of srcs) {
    (s.members || []).forEach(m => { if (!members.includes(m)) members.push(m); });
    Object.entries(s.names || {}).forEach(([k, v]) => { if (!names[k]) names[k] = v; });
    (s.teacherUids || []).forEach(u => { if (!tUids.includes(u)) tUids.push(u); });
    Object.assign(tNames, s.teacherNames || {});
    JSON.parse(JSON.stringify(s.sections || [])).forEach(sec => {
      sec.id = nid('s'); sec.items = (sec.items || []).map(i => ({ ...i, id: nid('i') }));
      if (titles.has(sec.title)) sec.title = sec.title + ' (' + s.name + ')';
      titles.add(sec.title); secs.push(sec);
    });
  }
  const srcIds = srcs.map(s => s.id);
  await Promise.all((S.banks || []).filter(b => srcIds.includes(b.classId)).map(b => api.update('banks', b.id, { classId: T.id })));
  await Promise.all(members.filter(m => { const u = S.users.find(x => x.id === m); return u && u.className !== T.name; }).map(m => api.update('users', m, { className: T.name }).catch(() => { })));
  await api.update('classes', T.id, { members, names, teacherUids: tUids, teacherNames: tNames, sections: secs, updatedAtMs: Date.now() });
  for (const s of srcs) await api.del('classes', s.id);
}

function parseBank(text) {
  const blocks = String(text || '').replace(/\r/g, '').split(/\n\s*\n+/).map(b => b.trim()).filter(Boolean), qs = [], bad = [];
  blocks.forEach((b, n) => {
    const q = [], o = {}; let ans = '', ex = '';
    b.split('\n').map(x => x.trim()).filter(Boolean).forEach(l => { let m;
      if ((m = l.match(/^([A-F])[\.\)]\s*(.+)$/i))) o[m[1].toUpperCase()] = m[2];
      else if ((m = l.match(/^(?:đáp án|dap an|answer|ans|đ\/a)\s*[:：]\s*([A-F])/i))) ans = m[1].toUpperCase();
      else if ((m = l.match(/^(?:giải thích|giai thich|explain|gt)\s*[:：]\s*(.+)$/i))) ex = m[1];
      else if (!Object.keys(o).length) q.push(l.replace(/^(câu\s*)?\d+\s*[\.\):]\s*/i, ''));
      else if (ex) ex += ' ' + l; });
    const keys = 'ABCDEF'.split('').filter(k => o[k]);
    if (q.length && keys.length >= 2 && ans && o[ans]) qs.push({ q: q.join(' '), o: keys.map(k => o[k]), a: keys.indexOf(ans), e: ex }); else bad.push(n + 1);
  });
  return { qs, bad };
}

function fileToBankText(name, text) {
  const ext = (name.split('.').pop() || '').toLowerCase(); const out = [];
  const put = (n, q, o, a, e) => out.push(`Câu ${n}. ${q}\n${o.map((x, k) => 'ABCDEF'[k] + '. ' + x).join('\n')}\nĐáp án: ${a}${e ? '\nGiải thích: ' + e : ''}`);
  if (ext === 'json') { let d = JSON.parse(text); d = Array.isArray(d) ? d : (d.qs || (d.banks && d.banks[0] && d.banks[0].qs) || []); d.forEach((x, n) => put(n + 1, x.q, x.o, typeof x.a === 'number' ? 'ABCDEF'[x.a] : String(x.a).toUpperCase(), x.e)); return out.join('\n\n'); }
  if (ext === 'csv' || ext === 'tsv') { const R = csvRows(text); const hd = /câu|question|^q$/i.test(String(R[0][0])) ? 1 : 0;
    // định dạng cột: Câu hỏi, A, B, C, D, Đáp án, Giải thích
    R.slice(hd).forEach((r, n) => { const o = [r[1], r[2], r[3], r[4]].map(x => (x || '').trim()).filter(Boolean), a = String(r[5] || '').trim().toUpperCase().charAt(0); if (r[0] && o.length >= 2 && a) put(n + 1, r[0].trim(), o, a, (r[6] || '').trim()); }); return out.join('\n\n'); }
  return text;
}

function vExam() {

/* ---------- cảnh báo nguy cơ học tập (dựa trên dữ liệu học tập của chính các em) ---------- */
function asgDoneBy(u, a) {
  const since = a.createdAtMs || 0;
  if (String(a.lessonId).startsWith('bk:')) return ((u.bankat || {})[a.lessonId.slice(3)] || 0) >= since;
  if (String(a.lessonId).startsWith('cd:')) { const n = a.lessonId.slice(3); return [(u.cdp || {})[n], (u.cdq || {})[n]].filter(Boolean).some(x => (x.at || 0) >= since) || ((u.cd || {})[n] || 0) >= since; }
  const p = (u.progress || {})[a.lessonId] || {}, acts = a.activity === 'any' ? Object.keys(p).filter(k => k.endsWith('At')).map(k => k.slice(0, -2)) : [a.activity];
  return acts.some(k => p[k] != null && p[k] !== false && (p[k + 'At'] || 0) >= since);
}
function riskRows() {
  const now = Date.now(), ms = ts => ts && ts.toDate ? ts.toDate().getTime() : typeof ts === 'number' ? ts : 0;
  return S.users.filter(u => !u.disabled).map(u => {
    const la = ms(u.lastActive), idle = la ? Math.floor((now - la) / 864e5) : 99; let xp7 = 0;
    for (let i = 0; i < 7; i++) { const d = new Date(); d.setDate(d.getDate() - i); xp7 += (u.daily || {})[dayKey(d)] || 0; }
    const sc = Object.values(u.progress || {}).flatMap(p => ['quiz', 'listen', 'fill', 'test', 'check'].map(k => p[k]).filter(n => typeof n === 'number')), avg = sc.length ? Math.round(sc.reduce((x, y) => x + y, 0) / sc.length) : null;
    const od = S.assignments.filter(a => a.due && new Date(a.due + 'T23:59:59') < new Date() && (a.studentIds && a.studentIds.length ? a.studentIds.includes(u.id) : (!a.className || norm(a.className) === norm(u.className))) && !asgDoneBy(u, a)).length;
    let s = 0; const why = [];
    if (idle >= 7) { s += 3; why.push(la ? 'Không học ' + idle + ' ngày' : 'Chưa từng học'); } else if (idle >= 3) { s += 2; why.push('Vắng ' + idle + ' ngày'); }
    if (xp7 === 0) { s += 2; why.push('0 XP trong 7 ngày'); } else if (xp7 < 30) { s += 1; why.push('Chỉ ' + xp7 + ' XP trong 7 ngày'); }
    if (od >= 2) { s += 2; why.push(od + ' bài quá hạn'); } else if (od === 1) { s += 1; why.push('1 bài quá hạn'); }
    if (avg != null && avg < 50) { s += 1; why.push('Điểm trung bình ' + avg + '%'); }

}
function vRisk() {
  const R = riskRows(), lv = s => s >= 5 ? ['Cao', '#D6293E', '#FDECEE'] : s >= 3 ? ['Trung bình', '#C98200', '#FFF4D9'] : ['Thấp', '#6B7480', '#F1F3F5'];

<script>
/* v22: lọc nhanh + sắp xếp cột cho mọi bảng quản trị */
(function(){
  const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();
  const numOf = s => { const t = s.trim().replace(/%$/, '').replace(/\s/g, ''); if (!/^-?\d[\d.,]*$/.test(t)) return null; return parseFloat(t.replace(/\./g, '').replace(',', '.')); };
  function sortBy(tb, i, th) {
    const dir = th.dataset.dir === 'asc' ? 'desc' : 'asc';
    tb.querySelectorAll('thead th').forEach(h => delete h.dataset.dir);
    th.dataset.dir = dir;
    const body = tb.tBodies[0]; if (!body) return;
    const key = r => (r.cells[i] ? r.cells[i].textContent.trim() : '');
    const isNum = [...body.rows].every(r => { const v = key(r); return v === '' || numOf(v) !== null; });
    const cmp = (a, b) => {
      const x = key(a), y = key(b);
      if (isNum) {
        const nx = numOf(x), ny = numOf(y);
        if (nx === null && ny === null) return 0;
        if (nx === null) return 1;
        if (ny === null) return -1;
        return nx - ny;
      }
      return x.localeCompare(y, 'vi', { numeric: true });
    };
    const rows = [...body.rows].sort((a, b) => { const c = cmp(a, b); return dir === 'asc' ? c : -c; });
    rows.forEach(r => body.appendChild(r));
  }
  function enhance() {
    document.querySelectorAll('.tbl-wrap table').forEach(tb => {
      if (tb.dataset.gs) return; tb.dataset.gs = '1';
      const wrap = tb.closest('.tbl-wrap'), body = tb.tBodies[0];
      if (!wrap || !body) return;
      tb.querySelectorAll('thead th').forEach((th, i) => {
        if (!th.textContent.trim() || th.querySelector('input,button,select')) return;
        th.dataset.sortable = '1';
        th.title = 'Bấm để sắp xếp';
        th.addEventListener('click', () => sortBy(tb, i, th));
      });
      const n = [...body.rows].filter(r => r.cells.length > 1).length;
      if (n >= 6 && wrap.parentNode) {
        const bar = document.createElement('div'); bar.className = 'gs-bar';
        bar.innerHTML = '<input type="search" class="gs-q" placeholder="Lọc bảng này…" aria-label="Lọc bảng"><span class="gs-cnt"></span>';
        wrap.parentNode.insertBefore(bar, wrap);
        const inp = bar.querySelector('input'), cnt = bar.querySelector('.gs-cnt');
        const total = body.rows.length;
        cnt.textContent = total + ' dòng';
        inp.addEventListener('input', () => {
          const q = norm(inp.value); let shown = 0;
          [...body.rows].forEach(r => { const ok = !q || norm(r.textContent).includes(q); r.hidden = !ok; if (ok) shown++; });
          cnt.textContent = q ? shown + ' / ' + total + ' dòng' : total + ' dòng';
        });
      }
    });
  }
  let t = null;
  const later = () => { clearTimeout(t); t = setTimeout(enhance, 60); };
  const root = document.getElementById('root');
  if (root) new MutationObserver(later).observe(root, { childList: true, subtree: true });
  enhance();
})();
</script>
<script>

(function(){
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      const ovs = document.querySelectorAll('.ov'), top = ovs[ovs.length - 1];

      setTimeout(() => { if (top.isConnected) top.dispatchEvent(new MouseEvent('mousedown', { bubbles: true })); }, 0);
      return;
    }
    const typing = /INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '');
    if (e.key === '/' && !typing && !e.ctrlKey && !e.metaKey && !document.querySelector('.ov')) {

  });
  function markWide() {
    document.querySelectorAll('.tbl-wrap table:not(.wide)').forEach(tb => {
      const n = tb.tHead && tb.tHead.rows[0] ? tb.tHead.rows[0].cells.length : 0;
      if (n > 6) tb.classList.add('wide');
    });
  }
  const bt = document.createElement('button');
  bt.id = 'gs-top'; bt.type = 'button'; bt.textContent = '↑';
  bt.title = 'Lên đầu trang'; bt.setAttribute('aria-label', 'Lên đầu trang');
  bt.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
  document.body.appendChild(bt);
  addEventListener('scroll', () => bt.classList.toggle('on', window.scrollY > 400), { passive: true });
  const root = document.getElementById('root');
  let t = null;
  if (root) new MutationObserver(() => { clearTimeout(t); t = setTimeout(markWide, 60); }).observe(root, { childList: true, subtree: true });
  markWide();
})();
</script>
</body>
</html>
