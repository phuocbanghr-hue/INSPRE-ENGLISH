<style>
:root{--red:#B30D31;--red-d:#8E0A27;--ink:#2B1B20;--mute:#7A6168;--bg:#FFF5F7;--line:#F4CBD5;--p1:#FFD9E0;--p2:#FFE4D1;--p3:#FFF2BF;--p4:#D2F0E2;--p5:#D8E9FF;--p6:#E7DDFF;--ok:#2FAE84}
*{box-sizing:border-box;margin:0}
body{font-family:'Nunito',system-ui,sans-serif;font-weight:600;color:var(--ink);line-height:1.5;min-height:100vh;
  background:radial-gradient(900px 520px at 100% -8%,#FFE0E8 0,transparent 62%),var(--bg);background-attachment:fixed}
h1,h2,h3{font-family:'Baloo 2','Nunito',sans-serif;font-weight:800;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #2F6BFF;outline-offset:2px}
.hidden{display:none!important}
.muted{color:var(--mute)}

.btn{border:0;background:var(--red);color:#fff;border-radius:12px;padding:8px 16px;font-weight:800;box-shadow:0 3px 0 var(--red-d);display:inline-flex;gap:6px;align-items:center;justify-content:center;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.soft{background:var(--p1);color:var(--ink);box-shadow:0 3px 0 #EDB3C1}
.btn.sm{padding:3px 11px;font-size:.88rem;box-shadow:0 2px 0 var(--red-d);border-radius:10px}
.btn.soft.sm{box-shadow:0 2px 0 #EDB3C1}
.btn[disabled]{opacity:.5;pointer-events:none}
.card{background:#fff;border:2px solid var(--line);border-radius:22px;box-shadow:0 10px 28px rgba(179,13,49,.07);padding:20px}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:.88rem;font-weight:800;margin-bottom:3px}
.field small{display:block;font-weight:600;color:var(--mute);margin-top:2px}
input,select,textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff;font-weight:600}
textarea{resize:vertical;min-height:84px}
.msg{min-height:1.3em;color:var(--red-d);font-size:.92rem;margin:4px 0 10px}

.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .card{width:min(420px,100%)}
.login img{width:76px;height:76px;border-radius:50%;display:block;margin:0 auto 10px}
.login h1{text-align:center;font-size:1.8rem;margin-bottom:16px}

.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:#fff;border-right:2px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.side .brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.side .brand img{width:44px;height:44px;border-radius:50%}
.side .brand b{font-family:'Baloo 2';font-size:1.25rem;font-style:italic;display:block;line-height:1}
.side .brand small{color:var(--red);font-weight:700}
.nb{background:none;border:0;text-align:left;padding:10px 12px;border-radius:14px;font-weight:800;display:flex;gap:10px;align-items:center;color:var(--mute);text-decoration:none}
.nb:hover{background:var(--bg)}
.nb.on{background:var(--p1);color:var(--red-d)}
.side .who{margin-top:auto;font-size:.82rem;color:var(--mute);word-break:break-all}
.content{padding:26px 28px 60px;min-width:0}
.content>h2{font-size:2rem;margin-bottom:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.row .grow{flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:20px}
.stat b{font-family:'Baloo 2';font-size:2.4rem;font-weight:800;display:block;line-height:1}
.stat.a{background:var(--p1)}.stat.b{background:var(--p5)}.stat.c{background:var(--p3)}.stat.d{background:var(--p4)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.card h3{margin-bottom:10px;font-size:1.25rem}
.hbar{display:grid;grid-template-columns:minmax(80px,36%) 1fr 70px;gap:10px;align-items:center;margin:8px 0;font-size:.92rem}
.hbar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .b{height:14px;border-radius:99px;overflow:hidden;background:var(--bg);border:2px solid var(--line)}
.hbar .b i{display:block;height:100%;background:var(--red);border-radius:99px}
.week{display:flex;align-items:flex-end;gap:10px;height:150px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:.78rem}
.week i{display:block;width:100%;max-width:38px;border-radius:10px 10px 4px 4px;background:var(--p1);min-height:6px}
.week .today i{background:var(--red)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th{text-align:left;font-weight:800;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:2px dashed var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.acts{display:flex;gap:6px;white-space:nowrap}
.tag{display:inline-block;white-space:nowrap;border-radius:99px;padding:0 10px;font-size:.82rem;font-weight:800;background:var(--p3)}
.tag.ok{background:var(--p4)}.tag.bad{background:#FFC9CF}.tag.off{background:#eee;color:var(--mute)}
.sw{position:relative;width:44px;height:24px;display:inline-block;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;border:2px solid var(--line);border-radius:99px;background:#fff;transition:.15s}
.sw i::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:var(--mute);top:2px;left:2px;transition:.15s}
.sw input:checked+i{background:var(--p4);border-color:var(--ok)}
.sw input:checked+i::after{left:22px;background:var(--ok)}
.sw input:focus-visible+i{outline:3px solid #2F6BFF;outline-offset:2px}
.empty{text-align:center;padding:30px;color:var(--mute)}
.ov{position:fixed;inset:0;background:rgba(43,27,32,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow-y:auto}
.modal{background:#fff;border-radius:24px;box-shadow:0 20px 60px rgba(43,27,32,.3);width:min(700px,100%);padding:24px}
.modal h3{font-size:1.5rem;margin-bottom:14px}
.g2{display:grid;grid-template-columns:90px 80px 1fr;gap:12px}
.g2b{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.test{background:var(--bg);border:2px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:.9rem;margin:-4px 0 12px}
.hint{background:var(--p3);border-radius:16px;padding:10px 14px;font-size:.92rem;margin-bottom:16px}
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;width:min(92vw,440px)}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700}
.toast.bad{background:var(--red)}.toast.warn{background:#8a5a00}
.pill-demo{background:var(--p5);border-radius:99px;padding:1px 10px;font-size:.78rem;font-weight:800}
@media(max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px;border-right:0;border-bottom:2px solid var(--line)}
  .side .brand{margin:0 8px 0 0}.side .brand small{display:none}.side .who{display:none}
  .cols,.g2,.g2b{grid-template-columns:1fr}
  .content{padding:18px 14px 50px}
}

:root{--red:#E11D48;--red-d:#9F1239;--ink:#2B1B20;--mute:#7A6168;--line:#F4CBD5}
body{font-family:'Plus Jakarta Sans','Nunito',system-ui,sans-serif!important;background:#FFF5F7!important}
h1,h2,h3{font-family:'Plus Jakarta Sans',sans-serif!important;letter-spacing:-.02em}
.side{background:linear-gradient(180deg,#7A0820,#A00B2D 70%,#D6445F)!important;color:#fff!important;border:0!important}
.side *{color:#fff}.side .nb{border-radius:14px;opacity:.82;text-align:left}.side .nb:hover{opacity:1;background:rgba(255,255,255,.1)!important}
.side .nb.on{opacity:1;background:linear-gradient(135deg,#FB4B70,#E11D48)!important;box-shadow:0 10px 22px -10px #E11D48}
.card{border:1px solid var(--line)!important;border-radius:22px!important;box-shadow:0 14px 34px -20px rgba(179,13,49,.3);background:#fff}
.stat.card{background:linear-gradient(135deg,#fff,#FFF1F4)}.stat b{background:linear-gradient(90deg,#E11D48,#E8546F);-webkit-background-clip:text;background-clip:text;color:transparent!important}
.btn:not(.soft){background:linear-gradient(135deg,#FB4B70,#E11D48 55%,#9F1239)!important;color:#fff!important;border:0!important;border-radius:999px!important}
.btn.soft{border-radius:999px!important}

@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.side{width:270px!important}.side .brand img{background:#fff;border-radius:14px;padding:4px}.side .nb{padding:13px 16px!important;font-weight:800;border:0!important;margin-bottom:4px}
.content{padding:34px 40px!important}.content>h1,.content>h2{font-size:2.1rem;margin-bottom:18px}
@media(prefers-reduced-motion:no-preference){.content>*,.stats>*{animation:up .5s cubic-bezier(.2,.8,.2,1) both}.stats>*:nth-child(2){animation-delay:.06s}.stats>*:nth-child(3){animation-delay:.12s}.stats>*:nth-child(4){animation-delay:.18s}}
.stats .stat.card{color:#fff;border:0!important;box-shadow:0 20px 36px -18px rgba(179,13,49,.55)}
.stats .stat.card:nth-child(4n+1){background:linear-gradient(135deg,#E11D48,#FB7185)!important}.stats .stat.card:nth-child(4n+2){background:linear-gradient(135deg,#E8546F,#FFB3C1)!important}
.stats .stat.card:nth-child(4n+3){background:linear-gradient(135deg,#FF8A9B,#FFC2CB)!important}.stats .stat.card:nth-child(4n+4){background:linear-gradient(135deg,#FF9A76,#FFD0A6)!important}
.stats .stat.card *{color:#fff!important;-webkit-text-fill-color:#fff!important;background:none!important}.stat b{font-size:2.4rem!important}
table{border-collapse:separate;border-spacing:0}th{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);background:#FFF0F3;padding:12px 14px!important}
td{padding:13px 14px!important;border-top:1px solid var(--line)}tbody tr{transition:background .15s}tbody tr:hover{background:#FFF7F9}
input,select,textarea{border-radius:14px!important;border:1.5px solid var(--line)!important;background:#fff}input:focus,select:focus,textarea:focus{border-color:#E11D48!important;box-shadow:0 0 0 4px rgba(225,29,72,.12);outline:0}
@media(max-width:860px){.content{padding:20px 16px!important}}

/* ===== v5: command center ===== */
body{background:radial-gradient(900px 500px at 105% -10%,#FFD6E0,transparent 60%),radial-gradient(700px 500px at -10% 110%,#FFE6D6,transparent 55%),#FFF7F9!important}
.login{background:radial-gradient(60% 60% at 20% 10%,#E11D48,transparent 70%),linear-gradient(135deg,#2A0610,#7A0820 55%,#C8203F)}
.login .card{background:rgba(255,255,255,.94)!important;backdrop-filter:blur(14px);border:0!important;border-radius:30px!important;box-shadow:0 40px 80px -30px rgba(0,0,0,.6)!important;padding:34px}
.side{background:radial-gradient(120% 55% at 0 0,rgba(251,75,112,.45),transparent 62%),linear-gradient(180deg,#240510,#560b1c 62%,#8E1230)!important;width:262px!important}
.side .nb{display:flex;gap:12px;align-items:center;padding:11px 14px!important;margin:0!important;font-weight:700;letter-spacing:.01em}
.side .nb svg{width:19px;height:19px;flex:none}
.side .nb.on{box-shadow:0 12px 26px -12px #FB4B70,inset 0 0 0 1px rgba(255,255,255,.18)}
.side .kbd{margin:8px 4px 10px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);border-radius:12px;padding:9px 12px;font-size:.84rem;text-align:left;opacity:.9;display:flex;justify-content:space-between;width:calc(100% - 8px)}
.side .kbd:hover{background:rgba(255,255,255,.16)}
.content{max-width:1280px}
.ahero{position:relative;overflow:hidden;border-radius:30px;padding:30px 34px;margin-bottom:22px;color:#fff;background:radial-gradient(60% 120% at 100% 0,#FF8FA5,transparent 60%),linear-gradient(120deg,#7A0820,#C8203F 55%,#E11D48);box-shadow:0 30px 60px -28px rgba(179,13,49,.7)}
.ahero:after{content:"";position:absolute;right:-60px;bottom:-90px;width:300px;height:300px;border-radius:50%;border:44px solid rgba(255,255,255,.1)}
.ahero small{opacity:.8;text-transform:capitalize;font-weight:700}.ahero h2{font-size:2.1rem!important;margin:4px 0 6px!important;color:#fff}.ahero p{opacity:.9;max-width:52ch}
.ahero .qa,.ahero .ins{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;position:relative;z-index:1}
.ahero .btn{background:#fff!important;color:#9F1239!important;box-shadow:none!important}.ahero .btn.ghost{background:rgba(255,255,255,.16)!important;color:#fff!important}
.ahero .ins span{background:rgba(255,255,255,.16);border-radius:999px;padding:5px 14px;font-weight:700;font-size:.88rem}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}.tool{display:flex;flex-direction:column;gap:10px;transition:transform .2s}.tool:hover{transform:translateY(-4px)}.tool p{flex:1;font-size:.92rem}
.btn.danger{background:linear-gradient(135deg,#7A0820,#B30D31)!important}
.bulk{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;margin-bottom:14px;border-radius:18px;background:#fff;border:1px dashed #F0A9B9}
.bk,#ball{width:18px!important;height:18px;accent-color:#E11D48;padding:0}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 14px}.thumbs img{width:92px;height:68px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.ov{backdrop-filter:blur(6px)}.modal{border-radius:28px!important}
.pal{max-width:620px;margin-top:8vh}.pal input{font-size:1.1rem;padding:14px 18px}.pl{margin-top:10px;max-height:52vh;overflow:auto}
.pl button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;background:none;padding:11px 14px;border-radius:14px;font-weight:700}.pl button:hover,.pl button.f{background:#FFE4EA}.pl small{color:var(--mute)}
.card{transition:box-shadow .2s}.card:hover{box-shadow:0 22px 44px -22px rgba(179,13,49,.38)}
/* ===== v6: pastel friendly ===== */
:root{--red:#BE0B2E;--red-d:#A3092A;--ink:#3A2A2F;--mute:#8C7077;--line:#FADADD;--bg:#FFF7F7;--p1:#FFE3E6;--p2:#FFE9D6;--p3:#FFF3C4;--p4:#D8F3E6;--p5:#DCEBFF;--p6:#EBE3FF}
body{background:#FFF9F9!important}
body:before{background:radial-gradient(520px 420px at 10% 6%,rgba(255,170,180,.28),transparent 70%),radial-gradient(560px 460px at 94% 14%,rgba(255,214,150,.26),transparent 70%),radial-gradient(640px 520px at 60% 106%,rgba(190,225,255,.26),transparent 70%)!important}
.btn:not(.soft):not(.mint){background:linear-gradient(135deg,#E8445C,#BE0B2E)!important;box-shadow:0 8px 0 -2px #8E0824,0 16px 24px -12px rgba(190,11,46,.55)!important;color:#fff!important;border-radius:999px!important}
.btn.soft{background:#FFE9EB!important;color:#A3092A!important;box-shadow:0 4px 0 #F8C9CE!important}
.card,.cgrp,.panel,.lcard,.acard,.cdc,.tool,.asg,.pstat{border:1px solid #FBE0E3!important;border-radius:26px!important;box-shadow:0 14px 34px -22px rgba(190,11,46,.4)!important;background:#fff!important}
.hm-t{background:linear-gradient(90deg,#BE0B2E,#E8445C)!important;-webkit-background-clip:text!important;background-clip:text!important}
.prog>i{background:linear-gradient(90deg,#FF9AA3,#FFC46B)!important}
.syl.s1{background:#BE0B2E!important}
.opt.ok,.tile.ok{background:#D8F3E6!important}
.lrow:hover{background:linear-gradient(90deg,#FFEDEF,transparent)!important}
.num{background:#BE0B2E!important}
.login{background:radial-gradient(50% 60% at 15% 10%,#FFD3D9,transparent 70%),radial-gradient(50% 60% at 90% 90%,#DCEBFF,transparent 70%),#FFF7F7!important}
.side{background:#fff!important;border-right:1px solid #FBE0E3!important;box-shadow:12px 0 40px -30px rgba(190,11,46,.5)}
.side,.side *{color:#3A2A2F}.side .brand small{color:#BE0B2E!important}.side .brand img{background:#FFF0F1}
.side .nb{color:#7A5F66!important;opacity:1!important}.side .nb:hover{background:#FFF0F1!important;color:#A3092A!important}
.side .nb.on{background:linear-gradient(135deg,#FFE3E6,#FFEBD9)!important;color:#A3092A!important;box-shadow:inset 0 0 0 2px #FFC9CF!important}
.side .kbd{background:#FFF7F7;border-color:#FADADD;color:#8C7077!important}.side .kbd *{color:#8C7077!important}
.side .btn.soft{color:#A3092A!important}
.ahero{background:linear-gradient(120deg,#FFE0E4,#FFEBD9 60%,#FFF6C9)!important;color:#3A2A2F!important;box-shadow:0 24px 50px -34px rgba(190,11,46,.6)!important}
.ahero:after{border-color:rgba(255,255,255,.7)}.ahero h2,.ahero p,.ahero small{color:#3A2A2F!important}
.ahero .ins span{background:#fff;color:#A3092A}.ahero .btn{background:#BE0B2E!important;color:#fff!important}.ahero .btn.ghost{background:#fff!important;color:#A3092A!important}
.stats .stat.card:nth-child(4n+1){background:#FFE3E6!important}.stats .stat.card:nth-child(4n+2){background:#DCEBFF!important}.stats .stat.card:nth-child(4n+3){background:#FFF3C4!important}.stats .stat.card:nth-child(4n+4){background:#D8F3E6!important}
.stats .stat.card,.stats .stat.card *{color:#3A2A2F!important;-webkit-text-fill-color:#3A2A2F!important}.stats .stat.card{box-shadow:0 14px 28px -22px rgba(190,11,46,.5)!important}
.btn.danger{background:linear-gradient(135deg,#E8707B,#A3092A)!important}
th{background:#FFF1F2!important}

/* ===== v7 ===== */
.cam{height:92px;width:auto;display:block;mix-blend-mode:multiply}.camwrap{display:inline-flex;align-items:center;gap:12px;background:#fff;border:1px solid #FBE0E3;border-radius:20px;padding:10px 16px;box-shadow:0 12px 24px -18px rgba(190,11,46,.5)}.camwrap small{color:#8C7077;font-weight:700;line-height:1.2;max-width:15ch}
.progs{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;position:relative;z-index:1}.progs span{background:#fff;color:#A3092A;border-radius:999px;padding:8px 18px;font-weight:800;box-shadow:0 10px 20px -14px rgba(190,11,46,.7)}.progs span:nth-child(2){background:#FFF3C4;color:#7A5A00}
.welcome{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin:0 0 20px;padding:24px 28px;border-radius:30px;background:radial-gradient(18px 18px at 12px 12px,rgba(255,255,255,.7) 40%,transparent 42%) 0 0/34px 34px,linear-gradient(120deg,#FFE0E4,#FFEBD9 60%,#E6F2FF);box-shadow:0 26px 50px -34px rgba(190,11,46,.7)}
.welcome h2{font-size:clamp(1.5rem,3.4vw,2.2rem);color:#3A2A2F}.welcome p{color:#6B5057;margin-top:4px}
.sfoot .camwrap{margin-top:10px}
.cgrp summary{background:linear-gradient(90deg,#FFF1F3,#fff)!important}
.stats{grid-template-columns:repeat(4,minmax(0,1fr))!important}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
.stats .stat.card{position:relative;overflow:hidden;padding:24px!important;border-radius:28px!important;font-weight:800}.stats .stat.card:after{content:"";position:absolute;right:-26px;bottom:-34px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.55)}.stats .stat b{font-size:2.8rem!important;margin-bottom:6px}
.week i{background:linear-gradient(180deg,#FFC9D0,#FFE9EC)!important}.week .today i{background:linear-gradient(180deg,#E8445C,#BE0B2E)!important}
.login .camwrap{margin:14px auto 0;display:flex;width:max-content}

.topbar:has(.nav){border-top:4px solid #BE0B2E}
.topbar:has(.nav) .navb.on{background:linear-gradient(135deg,#E8445C,#BE0B2E)!important;color:#fff!important;box-shadow:0 10px 20px -10px rgba(190,11,46,.7)!important}.topbar:has(.nav) .navb.on:after{display:none}

.auth .hero-copy{background:linear-gradient(135deg,#BE0B2E,#DB2A47 62%,#F58A98)!important;color:#fff!important;box-shadow:0 34px 60px -34px rgba(190,11,46,.8)}
.auth .hero-copy h1{-webkit-text-fill-color:#fff!important;color:#fff!important}.auth .hero-copy p{color:rgba(255,255,255,.92)!important}.auth .sun-art{color:rgba(255,255,255,.18)!important}

.cgrp summary{border-left:8px solid #BE0B2E}

.ahero .ins span{background:rgba(255,255,255,.18);color:#fff}.ahero .btn{background:#fff!important;color:#BE0B2E!important}.ahero .btn.ghost{background:rgba(255,255,255,.18)!important;color:#fff!important}

function sheetCsvUrl(url) {

  let m = url.match(/spreadsheets\/d\/e\/([\w-]+)/); if (m) return `https://docs.google.com/spreadsheets/d/e/${m[1]}/pub?output=csv` + (gid ? `&gid=${gid}` : '');
  m = url.match(/spreadsheets\/d\/([\w-]+)/); if (m) return `https://docs.google.com/spreadsheets/d/${m[1]}/gviz/tq?tqx=out:csv` + (gid ? `&gid=${gid}` : '');
  return null;
}
async function fetchSheetWords(url) {
  const u = sheetCsvUrl(url); if (!u) throw new Error('Link này không phải Google Sheet');
  const r = await fetch(u); if (!r.ok) throw new Error('Không đọc được Sheet (mã ' + r.status + ')');
  const t = await r.text(); if (t.trim().startsWith('<')) throw new Error('Sheet chưa chia sẻ "Bất kỳ ai có đường liên kết" (quyền Người xem)');
  return rowsToWords(parseCSV(t));
}
function parseManual(text) {
  return text.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const p = l.includes('\t') ? l.split('\t') : l.includes('|') ? l.split('|') : l.split(/\s+[-–=:]\s+/);
    return { en: (p[0] || '').trim(), vi: (p[1] || '').trim(), ipa: (p[2] || '').trim(), ex: (p[3] || '').trim() };
  }).filter(w => w.en && w.vi);
}
function parseMats(text) {
  return text.split('\n').map(l => l.trim()).filter(Boolean).map((l, i) => {
    const m = l.match(/https?:\/\/\S+/); if (!m) return null;
    const title = l.replace(m[0], '').replace(/[|\-–:]+\s*$/, '').replace(/^\s*[|\-–:]+/, '').trim();
    return { title: title || 'Tài liệu ' + (i + 1), url: m[0] };
  }).filter(Boolean);
}

  const close = () => { ov.remove(); refresh(); }; ov.addEventListener('mousedown', e => { if (e.target === ov) close(); }); return { ov, close };
}

  $('#content').onclick = e => { const g = e.target.closest('[data-go]'); if (g) { S.view = g.dataset.go; draw(); } };
}
async function bulkAct(e) {
  const b = e.target.closest('[data-ba]'); if (!b) return; const ids = [...document.querySelectorAll('.bk:checked')].map(x => x.dataset.bk);
  if (!ids.length) return toast('Tick chọn ít nhất một học sinh.', 'bad');
  const a = b.dataset.ba, us = S.users.filter(u => ids.includes(u.id)), each = f => Promise.all(us.map(f));
  try {
    if (a === 'cls') { const c = prompt('Chuyển ' + ids.length + ' bạn sang lớp:'); if (c === null) return; await each(u => api.update('users', u.id, { className: c.trim() })); }
    else if (a === 'xp') { const x = parseInt(prompt('Cộng bao nhiêu XP? (số âm để trừ)'), 10); if (!x) return; await each(u => api.update('users', u.id, { xp: Math.max(0, (u.xp || 0) + x) })); }
    else if (a === 'note') { const t = (prompt('Nội dung lời nhắn:') || '').trim(); if (!t) return; await each(u => api.update('users', u.id, { teacherNote: { text: t, at: Date.now() } })); }
    else if (a === 'lock' || a === 'unlock') await each(u => api.update('users', u.id, { disabled: a === 'lock' }));
    else if (a === 'reset') { if (!confirm('Đặt lại điểm và tiến độ của ' + ids.length + ' bạn?')) return; await each(u => api.update('users', u.id, RESET)); }
    else if (a === 'del') { if (!confirm('Xoá hồ sơ ' + ids.length + ' bạn? Không hoàn tác được.')) return; await each(u => api.del('users', u.id)); }
    else if (a === 'mail') { if (MODE !== 'firebase') return toast('Cần nối Firebase thật.', 'warn'); let n = 0; for (const u of us) if (u.email) try { await FB.sendPasswordResetEmail(auth, u.email); n++; } catch { } return toast('Đã gửi mail đặt lại mật khẩu cho ' + n + ' bạn.'); }
    toast('Xong, áp dụng cho ' + ids.length + ' học sinh.');
  } catch (er) { toast(er.message, 'bad'); }
}
document.addEventListener('click', async e => {
  const m = e.target.closest('[data-mail]'), ed = e.target.closest('[data-aedit]'), p = e.target.closest('[data-pal]');
  if (p && S.user) return palette();
  if (m) { if (MODE !== 'firebase' || !m.dataset.mail) return toast('Cần Firebase thật và học sinh có email.', 'warn'); try { await FB.sendPasswordResetEmail(auth, m.dataset.mail); toast('Đã gửi mail đặt lại mật khẩu.'); } catch (er) { toast(er.message, 'bad'); } }
  if (ed) { const a = S.assignments.find(x => x.id === ed.dataset.aedit); if (!a) return;
    const { ov, close } = modal(`<h3>Sửa bài đã giao</h3><label class="field"><span>Tiêu đề</span><input id="e-t" value="${esc(a.title)}"></label><div class="g2b"><label class="field"><span>Hạn nộp</span><input id="e-d" type="date" value="${esc(a.due || '')}"></label><label class="field"><span>Lớp</span><select id="e-c"><option value="">Tất cả học sinh</option>${classList().map(c => `<option ${c === a.className ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label></div><label class="field"><span>Lời nhắn</span><input id="e-n" value="${esc(a.note || '')}"></label><div class="row" style="justify-content:flex-end"><button class="btn soft" id="e-x">Huỷ</button><button class="btn" id="e-s">Lưu</button></div>`);
    $('#e-x', ov).onclick = close; $('#e-s', ov).onclick = async () => { try { await api.update('assignments', a.id, { title: $('#e-t', ov).value.trim() || a.title, due: $('#e-d', ov).value, className: $('#e-c', ov).value, note: $('#e-n', ov).value.trim() }); toast('Đã cập nhật bài giao.'); close(); } catch (er) { toast(er.message, 'bad'); } }; }
});
function palette() {
  const items = [...NAV.map(([k, , n]) => ({ t: n, s: 'Trang', run: () => { S.view = k; draw(); } })), ...S.users.map(u => ({ t: u.name || 'Học sinh', s: (u.className || '') + ' ' + (u.email || ''), run: () => studentModal(u) })), ...S.lessons.map(l => ({ t: l.title, s: 'Bài học', run: () => lessonForm(l) }))];
  const { ov, close } = modal(`<input id="pk" placeholder="Tìm trang, học sinh, bài học…  (Esc để đóng)"><div class="pl" id="pl"></div>`); ov.firstChild.classList.add('pal');
  let list = [], f = 0; const go = i => { const x = list[i]; if (x) { close(); setTimeout(x.run, 0); } };
  const paint = () => { const q = norm($('#pk', ov).value); list = items.filter(x => !q || norm(x.t + ' ' + x.s).includes(q)).slice(0, 30); f = 0; $('#pl', ov).innerHTML = list.map((x, i) => `<button data-i="${i}" class="${i ? '' : 'f'}"><b>${esc(x.t)}</b><small>${esc(x.s)}</small></button>`).join('') || '<div class="empty">Không thấy kết quả</div>'; };
  $('#pk', ov).oninput = paint; $('#pl', ov).onclick = e => { const b = e.target.closest('[data-i]'); if (b) go(+b.dataset.i); };
  $('#pk', ov).onkeydown = e => { if (e.key === 'Enter') go(f); else if (e.key === 'Escape') close(); else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); f = Math.max(0, Math.min(list.length - 1, f + (e.key === 'ArrowDown' ? 1 : -1))); $('#pl', ov).querySelectorAll('button').forEach((b, i) => b.classList.toggle('f', i === f)); $('#pl', ov).querySelectorAll('button')[f]?.scrollIntoView({ block: 'nearest' }); } };
  paint(); $('#pk', ov).focus();
}
addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k' && S.user) { e.preventDefault(); if (!document.querySelector('.ov')) palette(); } });
function siteExtra() {
  const t = S.site || {}, imgs = String(t.images || '').split('\n').map(x => x.trim()).filter(Boolean);
  $('#content').insertAdjacentHTML('beforeend', `<div class="card" style="max-width:720px;margin-top:18px"><h3>Hình ảnh và mạng xã hội</h3><p class="muted" style="margin-bottom:12px">Ảnh đầu tiên là ảnh nổi bật. Lấy ảnh từ Facebook: mở ảnh, chuột phải, "Sao chép địa chỉ hình ảnh" (hoặc dùng link ảnh Imgur, Drive công khai), rồi dán, mỗi dòng một ảnh. Ảnh hiện ở trang đăng nhập và trang chủ học sinh.</p>
    <label class="field"><span>Link ảnh (mỗi dòng một ảnh)</span><textarea id="w-img" rows="6" placeholder="https://…">${esc(t.images || '')}</textarea></label><div class="thumbs">${imgs.map(u => `<img src="${esc(u)}" alt="" referrerpolicy="no-referrer" onerror="this.style.opacity=.15">`).join('')}</div>
    <label class="field"><span>Link Facebook</span><input id="w-fb" value="${esc(t.facebook || 'https://www.facebook.com/inspireenglishcenter')}"></label><label class="field"><span>Link Zalo (không bắt buộc)</span><input id="w-zalo" value="${esc(t.zalo || '')}"></label>
    <div class="row" style="justify-content:flex-end;margin:0"><button class="btn" id="w-save2">Lưu hình ảnh và liên kết</button></div></div>`);
  $('#w-save2').onclick = async () => {
    const d = { images: $('#w-img').value.split('\n').map(x => x.trim()).filter(x => /^https?:\/\//.test(x)).join('\n'), facebook: $('#w-fb').value.trim(), zalo: $('#w-zalo').value.trim() };
    try { if (MODE === 'firebase') await FB.setDoc(FB.doc(db, 'config', 'site'), d, { merge: true }); else { S.site = { ...(S.site || {}), ...d }; localStorage.setItem('inspire_site', JSON.stringify(S.site)); } toast('Đã lưu hình ảnh và liên kết.'); } catch (er) { toast(er.message, 'bad'); }
  };
}
function vTools() {
  const T = [['bk', 'Sao lưu toàn bộ', 'Tải một file JSON gồm bài học, học sinh, bài tập, chuyên đề và cấu hình.'], ['rs', 'Khôi phục từ file sao lưu', 'Chọn file JSON đã sao lưu để ghi lại dữ liệu theo đúng ID.'], ['bc', 'Nhắn toàn bộ học sinh', 'Gửi một lời nhắn nổi bật cho tất cả học sinh.'], ['show', 'Hiện tất cả bài học', 'Mở toàn bộ bài cho học sinh.'], ['hide', 'Ẩn tất cả bài học', 'Tạm ẩn hết, dùng khi chỉnh sửa lớn.'], ['exp', 'Xoá bài tập hết hạn', 'Dọn các bài giao đã quá hạn.', 1], ['other', 'Xoá bài ngoài 2 khoá', 'Giữ nhóm "Ôn thi 9 lên 10" và "Unlock 7", xoá các bài thuộc nhóm khác.', 1], ['idle', 'Dọn học sinh bỏ học', 'Xoá hồ sơ em không hoạt động quá N ngày.', 1], ['xp', 'Đặt lại XP toàn trung tâm', 'Đưa XP của mọi học sinh về 0 (mở mùa mới).', 1]];
  $('#content').innerHTML = `<h2>Công cụ tối cao</h2><div class="hint">Khu vực toàn quyền. Thao tác nguy hiểm đều có bước xác nhận. Nên sao lưu trước khi dọn dẹp.</div><div class="tgrid">${T.map(([k, t, d, r]) => `<div class="card tool"><h3>${t}</h3><p class="muted">${d}</p><button class="btn ${r ? 'danger' : ''}" data-t="${k}">Thực hiện</button></div>`).join('')}</div><input type="file" id="rsf" accept=".json" class="hidden">`;
  $('#rsf').onchange = async e => {
    const f = e.target.files[0]; if (!f) return; if (MODE !== 'firebase') return toast('Khôi phục cần Firebase thật.', 'warn');
    try { const j = JSON.parse(await f.text()); let n = 0; if (!confirm('Ghi lại dữ liệu từ file này? Bản ghi cùng ID sẽ bị ghi đè.')) return;
      for (const col of ['lessons', 'users', 'assignments', 'chuyende']) for (const r of (j[col] || [])) { const { id, ...rest } = r; await FB.setDoc(FB.doc(db, col, String(id)), rest); n++; }
      if (j.site) await FB.setDoc(FB.doc(db, 'config', 'site'), j.site); if (j.announcement) await FB.setDoc(FB.doc(db, 'config', 'announcement'), j.announcement); toast('Đã khôi phục ' + n + ' bản ghi.'); } catch (er) { toast('Không khôi phục được: ' + er.message, 'bad'); }
  };
  $('#content').onclick = async e => {
    const k = e.target.closest('[data-t]')?.dataset.t; if (!k) return;
    try {
      if (k === 'bk') { const o = plain({ exportedAt: Date.now(), lessons: S.lessons, users: S.users, assignments: S.assignments, chuyende: Object.values(S.cd), site: S.site, announcement: S.ann }); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(o)], { type: 'application/json' })); a.download = 'inspire-backup-' + todayStr() + '.json'; a.click(); toast('Đã tải file sao lưu.'); }
      else if (k === 'rs') $('#rsf').click();
      else if (k === 'bc') { const t = (prompt('Lời nhắn gửi toàn bộ học sinh:') || '').trim(); if (!t) return; await Promise.all(S.users.map(u => api.update('users', u.id, { teacherNote: { text: t, at: Date.now() } }))); toast('Đã nhắn ' + S.users.length + ' bạn.'); }
      else if (k === 'show' || k === 'hide') { await Promise.all(S.lessons.map(l => api.update('lessons', l.id, { published: k === 'show' }))); toast(k === 'show' ? 'Đã hiện tất cả bài.' : 'Đã ẩn tất cả bài.'); }
      else if (k === 'exp') { const L = S.assignments.filter(a => a.due && new Date(a.due + 'T23:59:59') < new Date()); if (!L.length) return toast('Không có bài hết hạn.'); if (!confirm('Xoá ' + L.length + ' bài tập hết hạn?')) return; await Promise.all(L.map(a => api.del('assignments', a.id))); toast('Đã xoá ' + L.length + ' bài.'); }
      else if (k === 'other') { const ok = ['ôn thi 9 lên 10', 'unlock 7'], L = S.lessons.filter(l => !ok.includes(norm(l.topic))); if (!L.length) return toast('Không có bài nào ngoài 2 khoá.'); if (!confirm('Xoá ' + L.length + ' bài ngoài 2 khoá? Nên sao lưu trước.')) return; await Promise.all(L.map(l => api.del('lessons', l.id))); toast('Đã xoá ' + L.length + ' bài.'); }
      else if (k === 'idle') { const d = parseInt(prompt('Xoá học sinh không hoạt động quá bao nhiêu ngày?', '90'), 10); if (!d) return; const ms = x => x?.toMillis ? x.toMillis() : x || 0, L = S.users.filter(u => Date.now() - ms(u.lastActive) > d * 864e5); if (!L.length) return toast('Không có ai.'); if (!confirm('Xoá hồ sơ ' + L.length + ' học sinh?')) return; await Promise.all(L.map(u => api.del('users', u.id))); toast('Đã dọn ' + L.length + ' hồ sơ.'); }
      else if (k === 'xp') { if (prompt('Gõ XOA để đặt XP của tất cả học sinh về 0:') !== 'XOA') return; await Promise.all(S.users.map(u => api.update('users', u.id, { xp: 0, daily: {} }))); toast('Đã đặt lại XP.'); }
    } catch (er) { toast(er.message, 'bad'); }
  };
}
function vAdmins() {
  const sup = ADMIN_EMAILS, me = (S.user.email || '').toLowerCase(), can = MODE === 'demo' || ADMIN_EMAILS.map(x => x.toLowerCase()).includes(me), co = S.admins || [];

    ${can ? `<div class="row" style="margin-top:14px"><input id="ad-e" type="email" placeholder="email@vidu.com" style="max-width:300px"><button class="btn" id="ad-a">Thêm quản trị viên</button></div>` : '<p class="muted">Chỉ quản trị tối cao mới chỉnh sửa được danh sách này.</p>'}</div>`;
  const save = async l => { try { if (MODE === 'firebase') await FB.setDoc(FB.doc(db, 'config', 'admins'), { emails: l }); else S.admins = l; toast('Đã cập nhật danh sách.'); if (MODE !== 'firebase') vAdmins(); } catch (er) { toast(er.message, 'bad'); } };
  $('#ad-a') && ($('#ad-a').onclick = () => { const v = $('#ad-e').value.trim().toLowerCase(); if (!/^\S+@\S+\.\S+$/.test(v)) return toast('Email chưa đúng.', 'bad'); if (!co.includes(v)) save([...co, v]); });

}

/* ---------- khởi động ---------- */
const refresh = () => { if (!$('#content') || document.querySelector('.ov')) return; if (['dash', 'lessons', 'assign', 'hw'].includes(S.view)) draw(); else if (S.view === 'students') drawStudents(); };
function startData() {
  stopData();
  unsubs = [
    api.watch('lessons', l => { S.lessons = l; refresh(); }, e => toast('Không đọc được bài học: ' + e.message, 'bad')),
    api.watch('users', u => { S.users = u; refresh(); }, e => toast('Không đọc được học sinh: ' + e.message, 'bad')),
    api.watch('assignments', a => { S.assignments = a; refresh(); }, e => toast('Không đọc được bài tập đã giao: ' + e.message, 'bad')),
    api.watch('hwchecks', h => { S.hwx = Object.fromEntries(h.map(x => [x.id, x.s || {}])); if (S.view === 'hw') vHW(); }, e => toast('Không đọc được hwchecks: ' + e.message, 'bad')),
    api.watch('chuyende', c => { S.cd = Object.fromEntries(c.map(x => [x.id, x])); }, e => toast('Không đọc được chuyên đề: ' + e.message, 'bad')),
    api.watchAnn(a => { S.ann = a || { text: '', active: false }; }),
    MODE === 'firebase' ? FB.onSnapshot(FB.doc(db, 'config', 'admins'), d => { S.admins = d.exists() ? (d.data().emails || []) : []; if (S.view === 'admins') vAdmins(); }, () => {}) : null,
    MODE === 'firebase' ? FB.onSnapshot(FB.doc(db, 'config', 'site'), d => { S.site = d.exists() ? d.data() : {}; if (S.view === 'site') vSite(); }, () => {}) : (S.site = JSON.parse(localStorage.getItem('inspire_site') || '{}'), null)
  ];
}
const stopData = () => { unsubs.forEach(u => u && u()); unsubs = []; };

if (MODE === 'demo') console.warn('ADMIN ĐANG Ở CHẾ ĐỘ DÙNG THỬ: chưa dán firebaseConfig, dữ liệu KHÔNG lên Firebase.');
if (LOAD_ERR) viewLogin();
else {
  root.innerHTML = '<div class="login"><p>Đang tải…</p></div>';
  api.onAuth(async u => {
    stopData(); S.user = u;
    if (!u) { viewLogin(); return; }
    if (MODE === 'firebase' && !(await isAdminUser(u.email))) { api.signOut().then(() => viewLogin('Tài khoản này không có quyền quản trị.')); return; }
    startData(); shell();
  });
}
